<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="/urui/base.css" />
  <link rel="stylesheet" href="/urui/controls.css" />
  <link rel="stylesheet" href="/urui/behaviors.css" />
  <link rel="stylesheet" href="/urui-effect/Effect.css" />
  <link rel="stylesheet" href="/solstice/Css/tokens.css" />
  <link rel="stylesheet" href="/solstice/Css/base.css" />
  <link rel="stylesheet" href="/solstice/Css/solstice.css" />
</head>
<body>
  <div id="sol-root" class="sol-root theme-obsidian" style="padding-top: 56px;">
    <main class="stage-screen">
      <div class="lobby-wrap">
        <!-- Left HUD Column -->
        <section class="lobby-left-col">
          <div class="hud-panel commander-card">
            <div class="commander-top">
              <img id="lobby-cmd-avatar" class="commander-avatar" src="/solstice/Images/port-aurelia.png" />
              <div>
                <div class="commander-title">旅团统领 · Lv.64</div>
                <div class="commander-sub">RANK S · 第七远征军</div>
              </div>
            </div>
            <urui-progress-bar id="lobby-xp-progress" class="xp-bar" value="78" min="0" max="100"></urui-progress-bar>
            <div style="display: flex; justify-content: space-between; font-size: 11px; color: var(--sol-muted);">
              <span>骑士团经验</span>
              <span class="mono">78,420 / 100,000</span>
            </div>
          </div>

          <div class="hud-panel notice-banner-box">
            <div class="banner-shader-frame">
              <img id="lobby-surface-banner" src="/solstice/ShaderBanner/Flagship" />
            </div>
            <div class="banner-caption">
              <span id="lobby-banner-title">日冕旅团 · 曦光重燃</span>
              <span class="hud-chip-gold">赛季活跃</span>
            </div>
          </div>

          <div class="hud-panel quest-card">
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <span style="font-size: 13px; font-weight: 700; color: var(--sol-gold);">远征委托 · QUESTS</span>
              <span class="hud-chip">3 / 3</span>
            </div>
            <div class="quest-row">
              <span>讨伐灰烬巨像一次</span>
              <span class="mono" style="color: var(--sol-cyan);">+30 宝石</span>
            </div>
            <div class="quest-row">
              <span>星穹祈愿占卜共鸣</span>
              <span class="mono" style="color: var(--sol-gold);">+1 圣契</span>
            </div>
            <div class="quest-row">
              <span>强化英灵圣器等级</span>
              <span class="mono" style="color: var(--sol-emerald);">+8,000 金</span>
            </div>
          </div>
        </section>

        <!-- Center Hero Stage (Open 3D Sanctuary Vista behind cutout) -->
        <section class="lobby-center-stage">
          <urui-particles id="lobby-ambient-particles" class="lobby-particles"
            src="/solstice/Prefabs/ParticleStar.prefab"
            data-urui-play-on-load="true"
            data-urui-pause-when-hidden="true"
            data-urui-restart-on-show="true"></urui-particles>
          <img id="lobby-hero-figure" src="/solstice/Images/hero-aurelia.png" />

          <div class="hud-panel-strong hero-nameplate">
            <div>
              <div id="lobby-hero-name" class="nameplate-title">艾蕾莉亚 · AURELIA</div>
              <div id="lobby-hero-role" class="nameplate-role">SSR · 圣殿骑士 · 第七旅团长</div>
            </div>
            <button type="button" id="btn-lobby-inspect" class="hud-btn-cyan">查看档案</button>
          </div>
        </section>

        <!-- Right HUD Column & Primary Oblique CTA -->
        <section class="lobby-right-col">
          <div class="hud-panel chapter-card">
            <div style="display: flex; align-items: center; justify-content: space-between;">
              <span class="hud-chip-crimson">主线第四章 · EP.04</span>
              <span class="mono" style="font-size: 12px; color: var(--sol-cyan);">推荐战力 64,200</span>
            </div>
            <div class="chapter-title">灰烬圣桥 · 终焉试炼</div>
            <div class="chapter-desc">日冕圣坛上方出现高浓度灰烬畸变。部署先遣旅团，击碎巨像的古铜护盾并夺回星枢之火。</div>
            <div style="font-size: 11px; color: var(--sol-gold); margin-top: 2px;">出战看板角色切换 · SQUAD LEAD</div>
            <div class="squad-strip">
              <button type="button" id="lobby-lead-aurelia" class="squad-mini-btn is-selected">
                <img class="squad-mini-img" src="/solstice/Images/port-aurelia.png" />
                <span class="squad-mini-name">艾蕾莉亚</span>
              </button>
              <button type="button" id="lobby-lead-kael" class="squad-mini-btn">
                <img class="squad-mini-img" src="/solstice/Images/port-kael.png" />
                <span class="squad-mini-name">凯尔</span>
              </button>
              <button type="button" id="lobby-lead-lyra" class="squad-mini-btn">
                <img class="squad-mini-img" src="/solstice/Images/port-lyra.png" />
                <span class="squad-mini-name">莱拉</span>
              </button>
              <button type="button" id="lobby-lead-veyra" class="squad-mini-btn">
                <img class="squad-mini-img" src="/solstice/Images/port-veyra.png" />
                <span class="squad-mini-name">薇拉</span>
              </button>
            </div>
          </div>

          <div class="hud-panel-strong battle-cta-card">
            <div style="display: flex; justify-content: space-between; align-items: center; font-size: 12px;">
              <span style="color: var(--sol-muted);">消耗体力 <strong class="mono" style="color: var(--sol-cyan);">12</strong></span>
              <span style="color: var(--sol-gold);">掉落 · SSR 圣器胚</span>
            </div>
            <button type="button" id="btn-lobby-battle" class="hud-btn-cta battle-btn-lg">出征 BATTLE</button>
            <div class="lobby-action-row">
              <button type="button" id="btn-lobby-summon" class="hud-btn lobby-sub-cta">
                <img style="width: 16px; height: 16px;" src="/solstice/Images/icon-star.png" />
                <span>星盘祈愿</span>
              </button>
              <button type="button" id="btn-lobby-armory" class="hud-btn lobby-sub-cta">
                <img style="width: 16px; height: 16px;" src="/solstice/Images/icon-item-1.png" />
                <span>10k 军械库</span>
              </button>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>
</body>
</html>
