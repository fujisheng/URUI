name: RmlUnity Android APK on Mac

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rmlunity-android-mac
  cancel-in-progress: false

jobs:
  android-apk:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'fujisheng/RmlUnity'
    runs-on: [self-hosted, macOS, rmlunity-android]
    timeout-minutes: 120
    steps:
      - name: Check out trusted main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Verify source and local toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs
          exec > >(tee -a logs/preflight.log) 2>&1
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_REPOSITORY" = fujisheng/RmlUnity
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(tr -d '\r\n' < ProjectSettings/ProjectVersion.txt)" = 'm_EditorVersion: 2022.3.62f1'
          test -s Assets/Plugins/Android/libs/arm64-v8a/libRmlUnityBridge.so
          EDITOR_ROOT="${RMLUNITY_EDITOR_ROOT:-/Volumes/FData/RmlUnityBuild/Editor/2022.3.62f1}"
          EDITOR="$EDITOR_ROOT/Unity.app/Contents/MacOS/Unity"
          ANDROID="$EDITOR_ROOT/PlaybackEngines/AndroidPlayer"
          test -x "$EDITOR"
          test -d "$ANDROID/Variations/il2cpp"
          test -x "$ANDROID/SDK/platform-tools/adb"
          test -d "$ANDROID/NDK"
          test -x "$ANDROID/OpenJDK/bin/java"
          file Assets/Plugins/Android/libs/arm64-v8a/libRmlUnityBridge.so | grep -E 'ELF 64-bit.*(ARM aarch64|ARM64)'
          df -h .
          echo "RMLUNITY_EDITOR_ROOT=$EDITOR_ROOT" >> "$GITHUB_ENV"

      - name: Build Android ARM64 IL2CPP APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/Android logs
          "$RMLUNITY_EDITOR_ROOT/Unity.app/Contents/MacOS/Unity" \
            -batchmode -nographics -quit \
            -projectPath "$GITHUB_WORKSPACE" \
            -buildTarget Android \
            -executeMethod RmlUnity.Editor.AndroidBuild.Build \
            -logFile "$GITHUB_WORKSPACE/logs/unity-android.log"
          test -s build/Android/RmlUnity-MVP.apk

      - name: Verify APK structure and debug signature
        shell: bash
        run: |
          set -euo pipefail
          APK=build/Android/RmlUnity-MVP.apk
          unzip -t "$APK" | tee logs/zip-check.log
          unzip -Z -1 "$APK" > logs/apk-contents.txt
          grep -Fx 'lib/arm64-v8a/libRmlUnityBridge.so' logs/apk-contents.txt
          grep -Fx 'lib/arm64-v8a/libil2cpp.so' logs/apk-contents.txt
          stat -f 'APK bytes: %z' "$APK" | tee logs/apk-size.txt
          APKSIGNER=$(find "$RMLUNITY_EDITOR_ROOT/PlaybackEngines/AndroidPlayer/SDK/build-tools" -maxdepth 2 -type f -name apksigner | sort | tail -1)
          test -n "$APKSIGNER"
          JAVA_HOME="$RMLUNITY_EDITOR_ROOT/PlaybackEngines/AndroidPlayer/OpenJDK" "$APKSIGNER" verify --verbose "$APK" | tee logs/signature-check.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RmlUnity-Android-APK
          path: build/Android/RmlUnity-MVP.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RmlUnity-Android-Logs
          path: logs/
          if-no-files-found: warn
          retention-days: 7
