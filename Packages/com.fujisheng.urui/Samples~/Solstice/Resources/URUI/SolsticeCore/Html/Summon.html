<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="/urui/base.css" />
  <link rel="stylesheet" href="/urui/controls.css" />
  <link rel="stylesheet" href="/urui/behaviors.css" />
  <link rel="stylesheet" href="/solstice-core/Css/tokens.css" />
  <link rel="stylesheet" href="/solstice-core/Css/base.css" />
  <link rel="stylesheet" href="/solstice-core/Css/solstice.css" />
</head>
<body>
  <div id="sol-root" class="sol-root theme-obsidian" style="padding-top: 56px;">
    <img class="core-backdrop-img" src="/solstice-core/Images/bg-combat.png" />
    <main class="stage-screen">
      <div class="summon-wrap">
        <section class="hud-panel summon-altar-col">
          <div style="width: 100%; display: flex; justify-content: space-between; align-items: center;">
            <span class="hud-chip-gold">限时卡池 · 曦光重燃</span>
            <span id="summon-status-badge" class="hud-chip">星象星盘已就绪</span>
          </div>

          <div class="altar-ring-stage" style="width: 100%; height: 430px;">
            <img id="summon-altar-img" class="altar-circle-img" style="left: 215px; top: 15px; width: 400px; height: 400px;" src="/solstice-core/Images/summon-altar.png" />
            <div id="summon-card-box" class="summon-card-box">
              <img id="summon-card-img" class="summon-card-img" src="/solstice-core/Images/card-back.png" />
            </div>
            
          </div>

          <div style="width: 100%; display: flex; justify-content: space-between; align-items: center;">
            <div>
              <div id="summon-result-name" style="font-size: 18px; font-weight: 700; color: var(--sol-gold);">点击占卜唤醒沉睡英灵</div>
              <div id="summon-result-sub" style="font-size: 12px; color: var(--sol-muted);">序列轨迹多轨道 · 粒子星雨 · 天体卡牌翻转</div>
            </div>
            <button type="button" id="btn-summon-once" class="hud-btn-cta" style="height: 48px; padding: 0 22px; font-size: 15px; white-space: nowrap;">
              <img style="width: 18px; height: 18px;" src="/solstice-core/Images/icon-star.png" />
              <span>星盘祈愿 · 160 星辉石</span>
            </button>
          </div>
        </section>

        <aside class="hud-panel-strong summon-info-col">
          <div style="display: flex; flex-direction: column; gap: 10px;">
            <div style="font-size: 16px; font-weight: 700; color: var(--sol-gold);">UP 英灵概率清单</div>
            <div style="font-size: 12px; color: var(--sol-muted); line-height: 1.5;">
              每次星盘共鸣消耗 160 星辉石；80 抽保底必得限定 SSR 英灵（艾蕾莉亚 / 莱拉 / 薇拉）。
            </div>

            <div style="display: flex; flex-direction: column; gap: 6px; padding: 10px; border-radius: 8px; background-color: var(--sol-surface-soft); border: 1px solid var(--sol-border-soft);">
              <div style="display: flex; justify-content: space-between; font-size: 12px;">
                <span>距离保底 PITY</span>
                <span id="summon-pity-text" class="mono" style="color: var(--sol-cyan);">42 / 80</span>
              </div>
              <urui-progress-bar id="summon-pity-bar" class="squad-energy-bar" value="42" min="0" max="80"></urui-progress-bar>
            </div>

            <div class="quest-row">
              <span>SSR · 艾蕾莉亚（圣殿先锋）</span>
              <span class="mono" style="color: var(--sol-gold);">35%</span>
            </div>
            <div class="quest-row">
              <span>SSR · 莱拉 / 薇拉</span>
              <span class="mono" style="color: var(--sol-cyan);">35%</span>
            </div>
            <div class="quest-row">
              <span>SR · 凯尔（夜潮斥候）</span>
              <span class="mono" style="color: var(--sol-muted);">30%</span>
            </div>
          </div>

          <div style="display: flex; flex-direction: column; gap: 8px;">
            <button type="button" id="btn-summon-reset" class="hud-btn">重设卡牌背面预览</button>
            <button type="button" id="btn-summon-to-heroes" class="hud-btn-cyan">前往英灵殿查看</button>
          </div>
        </aside>
      </div>
    </main>
  </div>
</body>
</html>
