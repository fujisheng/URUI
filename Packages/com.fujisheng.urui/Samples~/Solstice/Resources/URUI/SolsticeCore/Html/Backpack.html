<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="/urui/base.css" />
  <link rel="stylesheet" href="/urui/controls.css" />
  <link rel="stylesheet" href="/urui/behaviors.css" />
  <link rel="stylesheet" href="/solstice-core/Css/tokens.css" />
  <link rel="stylesheet" href="/solstice-core/Css/base.css" />
  <link rel="stylesheet" href="/solstice-core/Css/solstice.css" />
</head>
<body>
  <div id="sol-root" class="sol-root theme-obsidian" style="padding-top: 56px;">
    <img class="core-backdrop-img" src="/solstice-core/Images/bg-lobby.png" />
    <main class="stage-screen">
      <div class="armory-wrap">
        <div class="hud-panel armory-toolbar">
          <div class="armory-filter-row">
            <button type="button" id="filter-all" class="fx-pill is-active">全部 10,000</button>
            <button type="button" id="filter-weapon" class="fx-pill">武器 Weapon</button>
            <button type="button" id="filter-relic" class="fx-pill">圣物 Relic</button>
            <button type="button" id="filter-crest" class="fx-pill">纹章 Crest</button>
            <button type="button" id="filter-stone" class="fx-pill">秘石 Stone</button>
          </div>
          <div style="display: flex; align-items: center; gap: 8px;">
            <span id="armory-count-label" class="mono" style="font-size: 12px; color: var(--sol-cyan);">10,000 项 · 虚拟列表池化中</span>
            <input type="text" id="armory-search" class="armory-search-box" placeholder="搜索圣器 / 编号 / 属性..." />
          </div>
        </div>

        <div class="armory-body">
          <section class="hud-panel armory-list-panel">
            <urui-list-view id="armory-listview" class="armory-listview"></urui-list-view>
          </section>

          <aside class="hud-panel-strong armory-detail-panel">
            <div style="display: flex; flex-direction: column; gap: 10px;">
              <div style="display: flex; justify-content: space-between; align-items: center;">
                <span id="armory-sel-rarity" class="hud-chip-gold">SSR</span>
                <span id="armory-sel-code" class="mono" style="font-size: 12px; color: var(--sol-muted);">SOL-00001</span>
              </div>
              <div style="display: flex; align-items: center; gap: 12px;">
                <img id="armory-sel-icon" style="width: 56px; height: 56px; border-radius: 10px; border: 1.5px solid var(--sol-gold); background-color: #090e1c;" src="/solstice-core/Images/icon-item-1.png" />
                <div>
                  <div id="armory-sel-name" style="font-size: 16px; font-weight: 700; color: var(--sol-gold);">日冕裁决剑 #1</div>
                  <div id="armory-sel-slot" style="font-size: 12px; color: var(--sol-muted);">主手圣器 · Lv.1</div>
                </div>
              </div>
              <div style="padding: 10px; border-radius: 8px; background-color: var(--sol-surface-soft); border: 1px solid var(--sol-border-soft);">
                <div style="font-size: 11px; color: var(--sol-muted);">属性加成</div>
                <div id="armory-sel-stat" class="mono" style="font-size: 13px; color: var(--sol-cyan); margin-top: 3px;">ATK +520 · 暴击 +5%</div>
              </div>
              <div style="font-size: 12px; line-height: 1.5; color: var(--sol-muted);">
                通过 URUI `ListView` 虚拟化视图及 `CompiledDocumentAsset` AOT 预编译秒开 10,000 件全量军械条目，滚动仅回收可视槽位。
              </div>
            </div>

            <div style="display: flex; flex-direction: column; gap: 8px;">
              <button type="button" id="btn-armory-equip" class="hud-btn-cta" style="height: 42px; font-size: 14px;">装配圣器</button>
              <button type="button" id="btn-armory-lock" class="hud-btn">切换锁定状态</button>
            </div>
          </aside>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
