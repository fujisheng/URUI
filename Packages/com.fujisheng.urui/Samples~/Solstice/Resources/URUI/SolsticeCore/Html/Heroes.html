<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="/urui/base.css" />
  <link rel="stylesheet" href="/urui/controls.css" />
  <link rel="stylesheet" href="/urui/behaviors.css" />
  <link rel="stylesheet" href="/solstice-core/Css/tokens.css" />
  <link rel="stylesheet" href="/solstice-core/Css/base.css" />
  <link rel="stylesheet" href="/solstice-core/Css/solstice.css" />
</head>
<body>
  <div id="sol-root" class="sol-root theme-obsidian" style="padding-top: 56px;">
    <img class="core-backdrop-img" src="/solstice-core/Images/bg-lobby.png" />
    <main class="stage-screen">
      <div class="heroes-wrap">
        <!-- Left Roster List -->
        <aside class="hud-panel heroes-roster-col">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <span style="font-size: 14px; font-weight: 700; color: var(--sol-gold);">英灵殿 · ROSTER</span>
            <span class="hud-chip">4 / 4</span>
          </div>

          <button type="button" id="hero-card-aurelia" class="hero-select-item is-selected">
            <img class="hero-select-thumb" src="/solstice-core/Images/port-aurelia.png" />
            <div class="hero-select-meta">
              <div class="hero-select-top"><span>艾蕾莉亚</span><span class="hud-chip-gold">SSR</span></div>
              <div class="mono" style="font-size: 11px; color: var(--sol-cyan);">Lv.72 · SOLAR</div>
            </div>
          </button>

          <button type="button" id="hero-card-kael" class="hero-select-item">
            <img class="hero-select-thumb" src="/solstice-core/Images/port-kael.png" />
            <div class="hero-select-meta">
              <div class="hero-select-top"><span>凯尔</span><span class="hud-chip">SR</span></div>
              <div class="mono" style="font-size: 11px; color: var(--sol-cyan);">Lv.65 · AZURE</div>
            </div>
          </button>

          <button type="button" id="hero-card-lyra" class="hero-select-item">
            <img class="hero-select-thumb" src="/solstice-core/Images/port-lyra.png" />
            <div class="hero-select-meta">
              <div class="hero-select-top"><span>莱拉</span><span class="hud-chip-gold">SSR</span></div>
              <div class="mono" style="font-size: 11px; color: var(--sol-cyan);">Lv.70 · ASTRAL</div>
            </div>
          </button>

          <button type="button" id="hero-card-veyra" class="hero-select-item">
            <img class="hero-select-thumb" src="/solstice-core/Images/port-veyra.png" />
            <div class="hero-select-meta">
              <div class="hero-select-top"><span>薇拉</span><span class="hud-chip-gold">SSR</span></div>
              <div class="mono" style="font-size: 11px; color: var(--sol-cyan);">Lv.68 · EMBER</div>
            </div>
          </button>
        </aside>

        <!-- Center Character Shader Showcase -->
        <section class="hud-panel heroes-stage-col">
          <img id="hero-wave-crest" class="wave-crest-img" src="/solstice-core/Images/summon-altar.png" />
          <img id="hero-stage-cutout" class="heroes-cutout-img aura-fx-target fx-foil" src="/solstice-core/Images/hero-aurelia.png" />
          <div id="arc-ribbon-host" class="arc-ribbon-stage">
            <span id="arc-ribbon-source">SOLSTICE · SANCTUARY VANGUARD</span>
            <span id="arc-ribbon-proto" class="arc-glyph-template" hidden></span>
          </div>
        </section>

        <!-- Right Stats, Shader Preset & Upgrade -->
        <aside class="hud-panel-strong heroes-detail-col">
          <div style="display: flex; flex-direction: column; gap: 10px;">
            <div style="display: flex; align-items: center; justify-content: space-between;">
              <span id="hero-detail-rarity" class="hud-chip-gold">SSR · 圣殿骑士</span>
              <span id="hero-detail-lv" class="mono" style="font-size: 15px; font-weight: 700; color: var(--sol-cyan);">Lv.72 / 80</span>
            </div>
            <div>
              <div id="hero-detail-name" style="font-size: 22px; font-weight: 700; color: var(--sol-gold);">艾蕾莉亚 · AURELIA</div>
              <div id="hero-detail-title" style="font-size: 12px; color: var(--sol-muted); margin-top: 2px;">曦光圣骑 · 第七旅团长</div>
            </div>

            <div class="stat-grid-flex">
              <div class="stat-cell">
                <div style="font-size: 11px; color: var(--sol-muted);">攻击力 ATK</div>
                <div id="hero-stat-atk" class="mono" style="font-size: 16px; font-weight: 700;">2,840</div>
              </div>
              <div class="stat-cell">
                <div style="font-size: 11px; color: var(--sol-muted);">生命值 HP</div>
                <div id="hero-stat-hp" class="mono" style="font-size: 16px; font-weight: 700;">18,400</div>
              </div>
              <div class="stat-cell">
                <div style="font-size: 11px; color: var(--sol-muted);">防御力 DEF</div>
                <div id="hero-stat-def" class="mono" style="font-size: 16px; font-weight: 700;">1,620</div>
              </div>
              <div class="stat-cell">
                <div style="font-size: 11px; color: var(--sol-muted);">暴击率 CRIT</div>
                <div id="hero-stat-crit" class="mono" style="font-size: 16px; font-weight: 700;">54%</div>
              </div>
            </div>

            <div style="display: flex; flex-direction: column; gap: 5px;">
              <div style="display: flex; justify-content: space-between; font-size: 11px;">
                <span style="color: var(--sol-muted);">羁绊同步率 Affinity</span>
                <span id="hero-affinity-text" class="mono" style="color: var(--sol-cyan);">86%</span>
              </div>
              <urui-progress-bar id="hero-affinity-bar" class="squad-energy-bar" value="86" min="0" max="100"></urui-progress-bar>
            </div>

            <div id="hero-detail-lore" class="hero-detail-lore">
              持星辉圣枪镇守日冕回廊的前线统领，能在护盾破防瞬间号令全队发动连携强袭。
            </div>
          </div>

          <div style="display: flex; flex-direction: column; gap: 10px;">
            <div style="font-size: 11px; font-weight: 700; color: var(--sol-gold);">灵装材质特效 · EFFECT SHADERS</div>
            <div class="fx-btn-row">
              <button type="button" id="fx-mode-foil" class="fx-pill is-active">星箔全息</button>
              <button type="button" id="fx-mode-shine" class="fx-pill">星纹扫光</button>
              <button type="button" id="fx-mode-halo" class="fx-pill">圣域光晕</button>
              <button type="button" id="fx-mode-dissolve" class="fx-pill">灰烬溶解</button>
            </div>
            <div style="display: flex; gap: 8px;">
              <button type="button" id="btn-hero-upgrade" class="hud-btn-cta" style="flex: 1; height: 42px; font-size: 14px;">强化升级 -4,800G</button>
              <button type="button" id="btn-hero-deploy" class="hud-btn-cyan" style="height: 42px;">设为出战</button>
            </div>
          </div>
        </aside>
      </div>
    </main>
  </div>
</body>
</html>
