<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="/urui/base.css" />
  <link rel="stylesheet" href="/urui/controls.css" />
  <link rel="stylesheet" href="/urui/behaviors.css" />
  <link rel="stylesheet" href="/solstice-core/Css/tokens.css" />
  <link rel="stylesheet" href="/solstice-core/Css/base.css" />
  <link rel="stylesheet" href="/solstice-core/Css/solstice.css" />
</head>
<body>
  <div id="sol-root" class="sol-root theme-obsidian" style="padding-top: 56px;">
    <img class="core-backdrop-img" src="/solstice-core/Images/bg-combat.png" />
    <main class="stage-screen">
      <div class="combat-wrap">
        <!-- Top Encounter Status + Boss Health -->
        <div class="combat-top-row">
          <div class="hud-panel combat-wave-panel">
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <span class="hud-chip-crimson">BOSS RAID · 激战</span>
              <span id="combat-wave-label" class="mono" style="font-size: 12px; color: var(--sol-gold);">WAVE 2/3</span>
            </div>
            <div style="font-size: 13px; font-weight: 700;">灰烬圣桥 · 第七远征点</div>
            <div id="combat-turn-label" class="mono" style="font-size: 11px; color: var(--sol-cyan);">ROUND T04 · 先遣队行动</div>
          </div>

          <div class="hud-panel-strong boss-hud-panel">
            <div class="boss-header">
              <div style="display: flex; align-items: center; gap: 8px;">
                <span class="hud-chip-crimson">LV.75 首领</span>
                <span class="boss-name">灰烬遗迹巨像 · ASHEN COLOSSUS</span>
              </div>
              <span id="boss-hp-text" class="mono" style="font-size: 12px; font-weight: 700; color: #ffbbc6; white-space: nowrap;">168,400 / 240,000</span>
            </div>
            <urui-progress-bar id="boss-hp-bar" class="boss-hp-bar" value="168400" min="0" max="240000"></urui-progress-bar>
            <div style="display: flex; align-items: center; justify-content: space-between; font-size: 11px;">
              <span style="color: var(--sol-gold);">古铜护盾 Shield</span>
              <span id="boss-shield-text" class="mono" style="color: var(--sol-gold);">34,000 / 60,000</span>
            </div>
            <urui-progress-bar id="boss-shield-bar" class="boss-shield-bar" value="34000" min="0" max="60000"></urui-progress-bar>
          </div>

          <div class="hud-panel combat-controls-panel">
            <button type="button" id="btn-combat-speed" class="tool-mini-btn">1x 速度</button>
            <button type="button" id="btn-combat-auto" class="tool-mini-btn">自动</button>
            <button type="button" id="btn-combat-reset" class="tool-mini-btn">回能</button>
          </div>
        </div>

        <!-- Middle Live Battlers Stage -->
        <div class="combat-arena-mid">
          <img id="combat-hero-img" src="/solstice-core/Images/hero-aurelia.png" />
          <img id="combat-boss-img" src="/solstice-core/Images/boss-colossus.png" />
          
          <div id="damage-callout" class="damage-callout is-crit" style="opacity: 0;">CRIT +28,450</div>
        </div>

        <!-- Bottom Squad HUD + 4 Radial360 Skill Slots -->
        <div class="combat-bottom-row">
          <div class="hud-panel squad-status-panel">
            <div style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 700;">
              <span>旅团生命 &amp; 星辉充能</span>
              <span id="squad-hp-text" class="mono" style="color: var(--sol-emerald);">18,450 / 21,200 (+3,200)</span>
            </div>
            <urui-progress-bar id="squad-hp-bar" class="squad-hp-bar" value="18450" min="0" max="21200"></urui-progress-bar>
            <div style="display: flex; justify-content: space-between; font-size: 11px;">
              <span style="color: var(--sol-cyan);">星能槽 Astral Energy</span>
              <span id="squad-energy-text" class="mono" style="color: var(--sol-cyan);">72 / 100</span>
            </div>
            <urui-progress-bar id="squad-energy-bar" class="squad-energy-bar" value="72" min="0" max="100"></urui-progress-bar>
            <div class="combat-log-list">
              <div id="combat-log-0" class="mono">T04 · 灰烬巨像开启日冕护盾，全队蓄能 72%</div>
              <div id="combat-log-1" class="mono">T03 · 艾蕾莉亚【晨曦贯刺】触发暴击 +14,820</div>
            </div>
          </div>

          <div class="hud-panel-strong skill-bar-panel">
            <button type="button" id="skill-btn-0" class="skill-btn">
              <div class="skill-icon-box">
                <img class="skill-icon-img" src="/solstice-core/Images/icon-skill-1.png" />
                <img id="skill-ring-0" class="skill-cd-disc" src="/solstice-core/Images/ui-ring-charge.png" />
                <img id="skill-cd-disc-0" class="skill-cd-disc" src="/solstice-core/Images/ui-cooldown-disc.png" />
                <span id="skill-cd-text-0" class="mono skill-cd-label"></span>
              </div>
              <span class="skill-name">晨曦贯刺</span>
              <span class="skill-meta">普攻 · +16 星能</span>
            </button>

            <button type="button" id="skill-btn-1" class="skill-btn">
              <div class="skill-icon-box">
                <img class="skill-icon-img" src="/solstice-core/Images/icon-skill-2.png" />
                <img id="skill-ring-1" class="skill-cd-disc" src="/solstice-core/Images/ui-ring-charge.png" />
                <img id="skill-cd-disc-1" class="skill-cd-disc" src="/solstice-core/Images/ui-cooldown-disc.png" />
                <span id="skill-cd-text-1" class="mono skill-cd-label">1.4s</span>
              </div>
              <span class="skill-name">星穹漩涡</span>
              <span class="skill-meta">战技 · 3.5s CD</span>
            </button>

            <button type="button" id="skill-btn-2" class="skill-btn">
              <div class="skill-icon-box">
                <img class="skill-icon-img" src="/solstice-core/Images/icon-skill-3.png" />
                <img id="skill-ring-2" class="skill-cd-disc" src="/solstice-core/Images/ui-ring-charge.png" />
                <img id="skill-cd-disc-2" class="skill-cd-disc" src="/solstice-core/Images/ui-cooldown-disc.png" />
                <span id="skill-cd-text-2" class="mono skill-cd-label"></span>
              </div>
              <span class="skill-name">圣盾庇护</span>
              <span class="skill-meta">援护 · +4,500 盾</span>
            </button>

            <button type="button" id="skill-btn-3" class="skill-btn is-ultimate">
              <div class="skill-icon-box">
                <img class="skill-icon-img" src="/solstice-core/Images/icon-skill-4.png" />
                <img id="skill-ring-3" class="skill-cd-disc" src="/solstice-core/Images/ui-ring-charge.png" />
                <img id="skill-cd-disc-3" class="skill-cd-disc" src="/solstice-core/Images/ui-cooldown-disc.png" />
                <span id="skill-cd-text-3" class="mono skill-cd-label">2.6s</span>
              </div>
              <span class="skill-name" style="color: var(--sol-gold);">日冕裁决</span>
              <span class="skill-meta">奥义 · 消耗 60 能量</span>
            </button>
          </div>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
