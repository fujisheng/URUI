<!doctype html>
<html><head><link rel="stylesheet" href="/urui/base.css"><link rel="stylesheet" href="/urui/controls.css"><title>North / 07 · Settings</title><link rel="stylesheet" href="../Game.css"></head><body><img id="backdrop" class="backdrop" src="../Images/world.png"><div class="menu-shade"></div><div class="page-header"><button id="back" class="back-button nine-frame"><label class="framed-caption">&lt;</label></button><label class="page-index">03</label><label class="page-title">SETTINGS</label></div><div id="content" class="settings-window nine-frame"><div class="settings-categories"><button id="tab-audio" class="settings-tab selected">AUDIO  &gt;</button><button id="tab-display" class="settings-tab">DISPLAY  &gt;</button><button id="tab-network" class="settings-tab">CONNECTION  &gt;</button></div><div class="settings-rows"><div id="group-audio"><label class="settings-group-title">AUDIO</label><div class="setting-line"><div class="setting-copy"><label>CONFIRMATION SOUND</label><label class="setting-help">Sample feedback audio only</label></div><div id="sound-switch" class="switch"><input id="sound" type="checkbox"><label id="sound-caption">ON</label><div class="switch-thumb"></div></div></div><div class="setting-line"><div class="setting-copy"><label>VOLUME</label><label class="setting-help">Does not alter global game audio</label></div><urui-slider><input id="volume" type="range" min="0" max="100" value="65"><div class="urui-slider-track"></div><div class="urui-slider-fill"></div><div class="urui-slider-thumb"></div></urui-slider><label id="volume-caption" class="value-caption">65%</label></div><button id="preview-audio" class="quiet nine-frame preview-button"><label class="framed-caption">PREVIEW SOUND</label></button></div><div id="group-display" class="hidden"><label class="settings-group-title">DISPLAY</label><div class="setting-line"><div class="setting-copy"><label>UI DENSITY</label><label class="setting-help">Inventory and ranking rows</label></div><urui-select><select id="density"><option value="Comfortable">Comfortable</option><option value="Compact">Compact</option></select><button type="button" class="urui-select-trigger" aria-expanded="false"><span class="urui-select-value"></span><span class="urui-select-arrow"></span></button><button type="button" class="urui-select-option" hidden=""></button><div class="urui-select-options" hidden=""></div></urui-select></div><div class="setting-line"><div class="setting-copy"><label>ACTION CONTRAST</label><label class="setting-help">Main action brightness</label></div><urui-select><select id="accent"><option value="Amber">Standard</option><option value="Glacier">High contrast</option></select><button type="button" class="urui-select-trigger" aria-expanded="false"><span class="urui-select-value"></span><span class="urui-select-arrow"></span></button><button type="button" class="urui-select-option" hidden=""></button><div class="urui-select-options" hidden=""></div></urui-select></div></div><div id="group-network" class="hidden"><label class="settings-group-title">CONNECTION</label><div class="setting-line"><div class="setting-copy"><label>MOCK SERVICE</label><label class="setting-help">Exercise offline errors and retry</label></div><urui-select><select id="connection"><option value="Online">Online</option><option value="Offline">Offline</option></select><button type="button" class="urui-select-trigger" aria-expanded="false"><span class="urui-select-value"></span><span class="urui-select-arrow"></span></button><button type="button" class="urui-select-option" hidden=""></button><div class="urui-select-options" hidden=""></div></urui-select></div><label class="settings-note">Both modes use local simulated data. No server is contacted.</label></div></div><div class="settings-footer"><button id="settings-cancel" class="quiet nine-frame"><label class="framed-caption">DISCARD</label></button><button id="save-settings" class="primary art-action "><label class="action-caption">APPLY</label><label class="action-chevron">&gt;</label></button></div><label id="status" class="settings-status">Changes affect this sample only. Apply to save locally.</label></div></body></html>
