<!doctype html>
<html><head><link rel='stylesheet' href='/urui/base.css'><link rel='stylesheet' href='/urui/controls.css'><style>
body { width:100%; min-height:100%; margin:0; padding:24px; box-sizing:border-box; background-color:#f1f1f1; font-family:"URUI Sans",sans-serif; font-size:16px; color:#323232; }
div, label, urui-foldout, urui-list-view, urui-progress-bar { display:block; }
label { margin-bottom:10px; }
.title { font-size:28px; margin-bottom:8px; }
.subtitle { color:#666666; margin-bottom:24px; }
.columns { display:flex; flex-direction:row; align-items:flex-start; width:100%; }
.card { width:23.5%; flex-shrink:0; margin-right:1.5%; padding:16px; box-sizing:border-box; background-color:#ffffff; border:1px solid #cccccc; }
.brand { display:flex; align-items:center; }
.brand img { width:28px; height:28px; margin-right:12px; }
.heading { font-size:20px; margin-bottom:18px; }
.caption { color:#666666; font-size:14px; }
.row { display:flex; align-items:center; margin-bottom:14px; }
.row label { margin:0 0 0 10px; }
textarea, select, input[type=number], input.field { width:100%; margin-bottom:16px; }
input[type=range] { width:100%; margin-bottom:16px; }
button { display:block; width:100%; margin-top:8px; }
urui-progress-bar { width:100%; margin-bottom:16px; }
urui-list-view { width:100%; height:280px; }
urui-scroll-view { width:100%; height:72px; margin-top:10px; }
.inventory-row { padding-left:8px; padding-top:4px; box-sizing:border-box; white-space:nowrap; }
.inventory-row:hover { background-color:#e5e5e5; }
#status { margin-top:22px; color:#404040; }
@media (max-width:760px) {
    .columns { display:block; }
    .card { width:100%; margin-right:0; margin-bottom:16px; }
}
urui-slider, urui-select { width:100%; margin-bottom:16px; }
urui-slider > input[type=range], .urui-select-trigger, .urui-select-option { margin:0; }
urui-scroll { width:100%; height:72px; margin-top:10px; }
urui-scroll > urui-scroll-view { margin:0; }
</style></head><body>
<div class="brand"><img id="sample-icon" src="runtime-controls-icon.png"/><label class="title">URUI Runtime Controls</label></div>
<label class="subtitle">Package control styles, editing, keyboard navigation and reusable rows.</label>
<div class="columns">
<div class="card"><label class="heading">Settings</label>
<div class="row"><input id="sound" type="checkbox" checked="checked"/><label for="sound">Sound enabled</label></div>
<label class="caption">Volume</label><urui-slider><input id="volume" type="range" min="0" max="100" value="50"/><div class="urui-slider-track"></div><div class="urui-slider-fill"></div><div class="urui-slider-thumb"></div></urui-slider>
<urui-progress-bar id="progress" role="progressbar"><div class="urui-progress-fill"></div><span class="urui-progress-title"></span><div class="urui-progress-content"></div></urui-progress-bar>
<label class="caption">Quality</label><urui-select><select id="quality"><option value="Low">Low</option><option value="Medium" selected="selected">Medium</option><option value="High">High</option></select><button type="button" class="urui-select-trigger" aria-expanded="false"><span class="urui-select-value"></span><span class="urui-select-arrow"></span></button><button type="button" class="urui-select-option" hidden></button><div class="urui-select-options" hidden></div></urui-select>
<urui-foldout data-urui-label="Advanced" data-urui-expanded="true"><button type="button" class="urui-foldout-header"><span class="urui-foldout-label">Advanced</span></button><div class="urui-foldout-content"><urui-scroll><urui-scroll-view id="advanced-scroll"><div class="urui-scroll-content"><div style="height:150px;"><label class="caption">Nested ScrollView</label><label class="caption">Use wheel, touch or focus and PageDown.</label><label class="caption">Collapsed content keeps its state.</label></div></div></urui-scroll-view><div class="urui-scrollbar" role="scrollbar" tabindex="0" aria-controls="advanced-scroll"><div class="urui-scrollbar-thumb"></div></div></urui-scroll></div></urui-foldout>
</div>
<div class="card"><label class="heading">Player profile</label>
<label class="caption">Player name</label><input id="player-name" class="field" type="text" value="Player">
<label class="caption">Mode</label>
<div class="row"><input id="casual" type="radio" name="mode" value="casual" checked="checked"/><label for="casual">Casual</label></div>
<div class="row"><input id="ranked" type="radio" name="mode" value="ranked"/><label for="ranked">Ranked</label></div>
<button id="apply">Apply profile</button>
<label class="caption">Use Tab, Shift+Tab, Enter and Space.</label>
</div>
<div class="card"><label class="heading">Editing</label>
<label class="caption">Quantity - Enter to commit</label><input id="count" type="number" data-urui-type="URUI.Controls.IntegerField" value="10"/>
<label class="caption">Weight - arrows step by 0.25</label><input id="weight" class="field" type="number" step="0.25" value="1.5"/>
<label class="caption">Selectable, read only</label><input id="read-only" class="field" type="text" value="Copy this text" readonly>
<label id="level-caption" class="caption">Level 5</label><urui-slider><input id="level" type="range" data-urui-type="URUI.Controls.IntegerSlider" min="1" max="10" value="5"/><div class="urui-slider-track"></div><div class="urui-slider-fill"></div><div class="urui-slider-thumb"></div></urui-slider>
</div>
<div class="card"><label class="heading">Inventory</label><label class="caption">1,000 items, visible rows only.</label><urui-list-view id="items"></urui-list-view></div>
</div><label id="status">Ready</label>
</body></html>
