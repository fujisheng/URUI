<!doctype html>
<html lang="zh-CN">
<head>
  <link rel="stylesheet" href="/urui/base.css" />
  <link rel="stylesheet" href="/urui/controls.css" />
  <link rel="stylesheet" href="../Tideglass.css" />
  <link rel="stylesheet" href="../Motion.css" />
</head>
<body>
  <div id="screen" class="screen login">
    <img class="full scenery intro-space" src="../Images/orbital.png" />
    <div class="full vignette"></div>
    <div class="title-field">
      <div class="intro-iris-camera"><img class="intro-iris" src="../Images/iris.png" /></div>
      <img class="intro-dial" src="../Images/aperture.png" />
      <img class="intro-flare" src="../Images/flare.png" />
      <div class="identity">
        <img class="brand" src="../Images/crest.png" />
        <div class="identity-rule"></div>
        <h1 class="wordmark">潮汐信标</h1>
        <button id="login" class="commit plane-key plane-front" type="button"><span class="key-camera"><span class="key-face"><span class="key-reflection"></span><span class="control-inner">游客登录</span><span class="key-sheen"></span></span></span></button>
      </div>
    </div>
    <div class="header"><div class="header-left"></div><div class="header-right"><button id="motion" class="motion" type="button">动效 · 开</button></div></div>
  </div>
</body>
</html>
