<!doctype html>
<html lang="zh-CN">
<head>
  <link rel="stylesheet" href="/urui/base.css" />
  <link rel="stylesheet" href="/urui/controls.css" />
  <link rel="stylesheet" href="../Tideglass.css" />
  <link rel="stylesheet" href="../Motion.css" />
</head>
<body>
  <div id="screen" class="screen hero">
    <img class="full scenery interior-space" src="../Images/operations.png" />
    <div class="full vignette"></div>
    <div class="world-grid"></div>
    <div class="projection hero-projection orbit-camera">
      <div id="orbit-object" class="orbit-subject">
        <img class="projection-lens" src="../Images/lens.png" />
        <img class="projection-dial" src="../Images/aperture.png" />
        <img class="projection-ring" src="../Images/orbit.png" />
        <img class="projection-light" src="../Images/glow.png" />
      </div>
    </div>
    <div id="pilot-anchor" class="pilot-anchor">
      <img id="pilot-platform" class="pilot-platform" src="../Images/pilot-platform.png" />
      <img class="pilot-reflection" src="../Images/pilot-reflection.png" />
      <img class="pilot-contact" src="../Images/pilot-contact.png" />
      <div class="pilot-reveal">
        <img id="pilot-art" class="pilot-art" src="../Images/pilot.png" />
      </div>
      <img class="pilot-scan" src="../Images/pilot-scan.png" />
    </div>
    <div id="hero-fx" class="hero-fx"><img id="hero-wave" class="full" src="../Images/shock.png" /></div>
    <img id="hero-trace" class="hero-trace" src="../Images/aperture.png" />
    <img id="hero-bloom" class="hero-bloom" src="../Images/flare.png" />
    <div id="orbit-input" class="orbit-input hero-input"></div>
    <div class="hero-readout readout">
      <div class="glass-optic"></div><div class="readout-glass"></div>
      <div class="edge-line"></div>
      <h2 class="readout-name">观澜</h2>
      <div class="hero-skills"><button id="preview-0" class="preview-skill plane-key console-key console-right" type="button"><span class="key-camera"><span class="key-face"><span class="key-reflection"></span><img class="preview-icon" src="../Images/skill-0.png" /><span>引潮</span></span></span></button><button id="preview-1" class="preview-skill plane-key console-key console-right" type="button"><span class="key-camera"><span class="key-face"><span class="key-reflection"></span><img class="preview-icon" src="../Images/skill-1.png" /><span>裂光</span></span></span></button><button id="preview-2" class="preview-skill plane-key console-key console-right" type="button"><span class="key-camera"><span class="key-face"><span class="key-reflection"></span><img class="preview-icon" src="../Images/skill-2.png" /><span>潮鸣</span></span></span></button></div>
      <div class="skill-info">
        <span id="preview-damage">伤害 36</span><span id="preview-charge">回能 +46</span><span id="preview-cooldown">冷却 2.4 秒</span>
      </div>
      <button id="rehearse" class="commit plane-key console-key console-right" type="button"><span class="key-camera"><span class="key-face"><span class="key-reflection"></span><span class="control-inner">预演技能</span><span class="key-sheen"></span></span></span></button>
    </div>
    <div class="orbit-help hero-help">拖动检视</div>
    <span id="notice" class="notice"></span>
    <div class="header"><div class="header-left"><button id="back" class="back" type="button" aria-label="返回"><img class="back-icon" src="../Images/back-icon.png" /></button><h1 class="page-title">英雄详情</h1></div><div class="header-right"><button id="motion" class="motion" type="button">动效 · 开</button></div></div>
  </div>
</body>
</html>
