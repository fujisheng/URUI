<!doctype html>
<html lang="zh-CN">
<head>
  <link rel="stylesheet" href="/urui/base.css" />
  <link rel="stylesheet" href="/urui/controls.css" />
  <link rel="stylesheet" href="../Tideglass.css" />
  <link rel="stylesheet" href="../Station.css" />
  <link rel="stylesheet" href="../Motion.css" />
</head>
<body>
  <div id="screen" class="screen result">
<div class="full result-veil"></div>
    <img id="victory-rays" class="victory-rays" src="../Images/flare.png" />
    <div class="result-stage">
      <img id="result-orbit" class="result-orbit" src="../Images/iris.png" />
      <img id="result-crest" class="result-crest" src="../Images/crest.png" />
      <img id="result-dial" class="result-dial" src="../Images/orbit.png" />
      <div class="result-copy" id="result-copy">
        <span id="result-sector" class="result-sector"></span>
        <h1 id="result-title" class="wordmark result-title">信标点亮</h1>
        <div class="result-stats"><span id="result-time"></span><span id="result-casts"></span></div>
        <div id="result-reward" class="reward"><img id="result-currency" class="credit" src="../Images/credit.png" /><span id="result-pay">潮晶 +60</span></div>
        <button id="finish" class="commit plane-key plane-front" type="button"><span class="key-camera"><span class="key-face"><span class="key-reflection"></span><span class="control-inner">返回引潮站</span><span class="key-sheen"></span></span></span></button>
        <button id="result-chart" class="result-link" type="button"><span id="result-next"></span><span id="result-link-tail" class="chart-dash">　航线图 ›</span></button>
      </div>
    </div>
  </div>
</body>
</html>
