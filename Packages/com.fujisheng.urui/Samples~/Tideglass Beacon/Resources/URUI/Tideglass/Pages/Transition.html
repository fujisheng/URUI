<!doctype html>
<html lang="zh-CN">
<head>
  <link rel="stylesheet" href="/urui/base.css" />
  <link rel="stylesheet" href="../Tideglass.css" />
  <link rel="stylesheet" href="../Station.css" />
  <link rel="stylesheet" href="../Motion.css" />
</head>
<body>
  <div id="screen" class="screen transition">
    <div id="nav-veil" class="full nav-veil"></div>
    <div id="prism-a" class="prism-band prism-a"><div class="cut-glass"></div><img class="full prism-etching" src="../Images/prism-etching.png" /></div>
    <div id="prism-b" class="prism-band prism-b"><div class="cut-glass"></div><img class="full prism-etching" src="../Images/prism-etching.png" /></div>
    <img id="atlas-trace" class="atlas-trace" src="../Images/star-chart.png" />
    <img id="nav-reticle" class="nav-reticle" src="../Images/orbit.png" />
    <img id="warp-fan" class="full warp-fan" src="../Images/warp-trails.png" />
    <img id="jump-light" class="jump-light" src="../Images/flare.png" />
    <img id="warp-ring" class="warp-ring" src="../Images/shock-violet.png" />
    <div id="rack-top" class="rack-leaf rack-top"><img class="rack-teeth" src="../Images/prism-etching.png" /></div>
    <div id="rack-bottom" class="rack-leaf rack-bottom"><img class="rack-teeth" src="../Images/prism-etching.png" /></div>
    <img id="focus-fan" class="full focus-fan" src="../Images/diaphragm.png" />
    <img id="focus-glass" class="focus-glass" src="../Images/aperture.png" />
    <div id="record-leaf" class="full record-leaf"><img class="folio-watermark" src="../Images/folio-mark.png" /></div>
    <div id="record-edge" class="record-edge"></div>
    <div id="range-slit" class="full range-slit"></div><img id="range-sight" class="range-sight" src="../Images/range-mark.png" />
    <div id="shutter-top" class="shutter shutter-top"></div>
    <div id="shutter-bottom" class="shutter shutter-bottom"></div>
    <img id="shutter-dial" class="shutter-dial" src="../Images/aperture.png" />
    <img id="shutter-flare" class="shutter-flare" src="../Images/pilot-scan.png" />
  </div>
</body>
</html>
