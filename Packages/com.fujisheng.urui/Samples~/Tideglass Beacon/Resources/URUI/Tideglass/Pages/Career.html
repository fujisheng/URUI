<!doctype html>
<html lang="zh-CN">
<head>
  <link rel="stylesheet" href="/urui/base.css" />
  <link rel="stylesheet" href="/urui/controls.css" />
  <link rel="stylesheet" href="../Tideglass.css" />
  <link rel="stylesheet" href="../Station.css" />
  <link rel="stylesheet" href="../Motion.css" />
  <link rel="stylesheet" href="../Bridge.css" />
</head>
<body>
  <div id="screen" class="screen bridge career">
    <img class="full scenery career-sky" src="../Images/orbital.png" /><div class="full career-shadow"></div>
    <div class="honor-case"><div class="medal-ring"></div><img id="rank-medal" class="rank-medal" src="../Images/insignia-0.png" /><div class="medal-glint" id="medal-glint"></div><h2 id="career-rank"></h2><span id="career-merit"></span><div class="rank-track"><img id="rank-fill" class="full" src="../Images/health.png" /></div><span id="career-stats"></span></div>
    <div class="titles-case"><button id="badge-0" class="bridge-key plane-key badge-key" type="button"><span class="key-camera"><span class="key-face"><img class="ribbon-icon" src="../Images/ribbon-0.png" /><span class="badge-name">见习领航</span><span id="badge-state-0" class="badge-state"></span><span class="key-reflection"></span></span></span></button><button id="badge-1" class="bridge-key plane-key badge-key" type="button"><span class="key-camera"><span class="key-face"><img class="ribbon-icon" src="../Images/ribbon-1.png" /><span class="badge-name">远潮信使</span><span id="badge-state-1" class="badge-state"></span><span class="key-reflection"></span></span></span></button><button id="badge-2" class="bridge-key plane-key badge-key" type="button"><span class="key-camera"><span class="key-face"><img class="ribbon-icon" src="../Images/ribbon-2.png" /><span class="badge-name">点灯人</span><span id="badge-state-2" class="badge-state"></span><span class="key-reflection"></span></span></span></button><button id="badge-3" class="bridge-key plane-key badge-key" type="button"><span class="key-camera"><span class="key-face"><img class="ribbon-icon" src="../Images/ribbon-3.png" /><span class="badge-name">无隙领航员</span><span id="badge-state-3" class="badge-state"></span><span class="key-reflection"></span></span></span></button><div id="title-rule"></div><button id="wear-title" class="bridge-key plane-key bridge-action " type="button"><span class="key-camera"><span class="key-face"><span class="control-inner">佩戴称号</span><span class="key-reflection"></span></span></span></button></div>
    <div class="header"><div class="header-left"><button id="back" class="bridge-key plane-key back utility-key" type="button" aria-label="返回"><span class="key-camera"><span class="key-face"><img class="back-icon" src="../Images/back-icon.png" /><span class="key-reflection"></span></span></span></button><h1 class="page-title">航籍</h1></div><div class="header-right"><button id="motion" class="bridge-key plane-key motion utility-key" type="button" aria-label="切换动效"><span class="key-camera"><span class="key-face"><span id="motion-label">动效 · 开</span><span class="key-reflection"></span></span></span></button></div></div>
  </div>
</body>
</html>
